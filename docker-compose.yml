services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: rag
    ports:
      - '${POSTGRES_HOST_PORT:-5443}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d rag']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  # One-off job: applies migrations, then exits.
  migrate:
    build: .
    command: ['alembic', 'upgrade', 'head']
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/rag
      ADMIN_API_KEY: migrations-do-not-use-this-key-xxxxxxxxxxxx
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/rag
      SECRETS_SOURCE: local
      LOCAL_STORAGE_DIR: /app/data/uploads
    ports:
      - '${API_HOST_PORT:-8000}:8000'
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  uploads:
